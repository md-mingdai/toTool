name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']          # 推送 v1.0.0 这类标签时，自动发布到 Releases
  pull_request:
  workflow_dispatch:      # 允许在 Actions 页面手动点「Run workflow」

# 同一分支上有新提交时，取消还没跑完的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 前端单独构建一次，四个架构的 APK 下载同一份 dist，
  # 放进 app/src/main/assets/flashdrop/，由手机端 HTTP 服务读取。
  web:
    name: Web · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建前端
        working-directory: web
        run: npm run build

      - name: 上传 Web 资源
        uses: actions/upload-artifact@v7
        with:
          name: flashdrop-web
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 每个 CPU 架构各打一个 APK，四个架构并行。每个任务自己完成整条流程：
  #   从源码交叉编译这个架构的 FFmpeg（纯 LGPL，有缓存，通常直接复用）→ 放进 jniLibs → 打这个架构的 APK
  # 所以 Artifacts 里只有 APK，没有 libffmpeg 之类的中间产物。
  #
  # 编译脚本、版本号、校验值都在 ffmpeg/ 目录下，升级 FFmpeg 只需要改 ffmpeg/versions.env。
  # ---------------------------------------------------------------------------
  build:
    name: APK · ${{ matrix.abi }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 第一次要先编 FFmpeg（十几分钟到半小时），之后命中缓存就快了

    strategy:
      fail-fast: false        # 某个架构失败时，其它架构继续，方便一次看全问题
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    env:
      ABI: ${{ matrix.abi }}
      FFMPEG_INSTALL: '0'     # 下面统一把 libffmpeg.so 放进 jniLibs，不用 build.sh 再复制一遍

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载 Web 资源
        uses: actions/download-artifact@v8
        with:
          name: flashdrop-web
          path: app/src/main/assets/flashdrop

      - name: 校验 Web 构建产物
        run: |
          test -f app/src/main/assets/flashdrop/index.html
          test -d app/src/main/assets/flashdrop/assets
          if [ -e app/src/main/assets/flashdrop/node_modules ] || [ -e app/src/main/assets/flashdrop/src ]; then
            echo "::error::assets/flashdrop 里混入了前端源码或 node_modules，只应打包 web/dist 构建产物"
            exit 1
          fi

      # ---------------- FFmpeg ----------------
      # 缓存键里带着编译脚本和版本文件的哈希：这两个文件没改，就直接复用上次编好的 libffmpeg.so，
      # 平时只改应用代码的提交不会重新编译 FFmpeg。
      - name: 计算 FFmpeg 缓存键
        id: key
        run: echo "ffmpeg=ffmpeg-${ABI}-${{ hashFiles('ffmpeg/build.sh', 'ffmpeg/versions.env') }}" >> "$GITHUB_OUTPUT"

      - name: 还原已编好的 libffmpeg.so（缓存）
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ffmpeg/out/${{ matrix.abi }}
          key: ${{ steps.key.outputs.ffmpeg }}

      - name: 安装 FFmpeg 编译工具
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          # nasm：x86_64 的汇编优化要用；其余（git / curl / make / cmake / gcc / binutils）runner 上自带，
          # pkg-config 也是自带的，这里写上只是保险
          sudo apt-get install -y --no-install-recommends nasm pkg-config
          for t in git curl make cmake pkg-config gcc readelf; do
            command -v "$t" > /dev/null || { echo "::error::runner 上没有 $t"; exit 1; }
          done
          cmake --version | head -n 1

      - name: 准备 Android NDK
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          # NDK 版本固定在 ffmpeg/versions.env 里，保证每次编出来的东西一样
          source ffmpeg/versions.env
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "${NDK_DIR}/toolchains/llvm/prebuilt" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "ndk;${NDK_VERSION}"
          fi
          [ -d "${NDK_DIR}/toolchains/llvm/prebuilt" ] || { echo "::error::没有装好 NDK ${NDK_VERSION}"; exit 1; }
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: 编译 FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash ffmpeg/build.sh "$ABI"

      # 编完马上存缓存：后面的 Gradle 步骤万一失败，也不用把 FFmpeg 重新编一遍
      - name: 保存编好的 libffmpeg.so（缓存）
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ffmpeg/out/${{ matrix.abi }}
          key: ${{ steps.key.outputs.ffmpeg }}

      # 命中缓存时没有重新编译，这里单独再检查一遍（ELF 格式、16 KB 对齐、只依赖系统库、纯 LGPL）
      - name: 校验缓存里的 libffmpeg.so
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        run: |
          bash ffmpeg/build.sh verify "$ABI"
          {
            echo "### FFmpeg ($ABI)（来自缓存）"
            echo '```'
            cat "ffmpeg/out/$ABI/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 以前仓库里提交过一份 arm64 的预编译 libffmpeg.so；万一还残留着，先清掉，
      # 保证打进 APK 的是上面从源码编出来的
      - name: 把 libffmpeg.so 放进 jniLibs
        run: |
          rm -f app/src/main/jniLibs/*/libffmpeg.so
          mkdir -p "app/src/main/jniLibs/$ABI"
          cp "ffmpeg/out/$ABI/libffmpeg.so" "app/src/main/jniLibs/$ABI/libffmpeg.so"
          ls -l "app/src/main/jniLibs/$ABI"

      # ---------------- APK ----------------
      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          # basic = 开源缓存实现，公开/私有仓库都免费
          cache-provider: basic

      - name: 准备构建环境
        run: |
          # local.properties 里是本机的 SDK 路径，在云端会导致 "SDK location not found"
          rm -f local.properties
          # 从 Windows 提交的仓库可能丢失可执行位
          chmod +x gradlew
          # 预先接受 Android SDK 许可证，Gradle 才能自动下载 compileSdk 37 的平台包
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ---- 可选：固定签名密钥（不配置也能构建，用 debug 签名）----
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已使用 Secrets 中的签名密钥"
          else
            echo "::notice title=未配置签名密钥::使用 debug 签名。每次构建的 debug 签名都不同，安装新版前需要先卸载旧版。"
          fi

      # -PabiFilter：只打这一个架构（app/build.gradle.kts 里读取）
      - name: 构建 Release APK（${{ matrix.abi }}）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease "-PabiFilter=$ABI" --stacktrace

      - name: 整理 APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NAME="toTool-v${VERSION}-${SHORT_SHA}-${ABI}"
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "::error::没有找到构建出的 APK"; exit 1; fi
          cp "$SRC" "dist/${NAME}.apk"
          ls -lh dist
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "- \`${ABI}\`：$(du -h "dist/${NAME}.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # 确认 APK 里带着这个架构的 libffmpeg.so，并且没有混进其它架构的原生库
      - name: 检查 APK 里的原生库与网页资源
        run: |
          APK=$(find dist -name '*.apk' | head -n 1)
          LIBS=$(unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' || true)
          echo "$LIBS"
          echo "$LIBS" | grep -qx "lib/${ABI}/libffmpeg.so" || { echo "::error::APK 里没有 lib/${ABI}/libffmpeg.so"; exit 1; }
          if echo "$LIBS" | grep -v "^lib/${ABI}/" | grep -q .; then
            echo "::warning::APK 里混进了其它架构的原生库（-PabiFilter 没有生效？）"
          fi
          # 网页只为构建产物；源码、依赖和 package 文件不能进 APK
          ASSETS=$(unzip -Z1 "$APK" | grep '^assets/flashdrop/' || true)
          echo "$ASSETS" | grep -qx 'assets/flashdrop/index.html' || { echo "::error::APK 里没有 assets/flashdrop/index.html"; exit 1; }
          if echo "$ASSETS" | grep -Eq '^assets/flashdrop/(src|node_modules|package\.json|package-lock\.json)'; then
            echo "::error::APK 的 assets/flashdrop 里混入了前端源码或依赖"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- 失败时，把详细报告传上来方便排查 ----
      - name: 上传构建报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.abi }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      # FFmpeg 编译失败时的完整日志（各组件的 configure / make 输出，以及 config.log）
      - name: 上传 FFmpeg 编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-logs-${{ matrix.abi }}
          path: ffmpeg/work/${{ matrix.abi }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    # 只有推送 v* 标签时才发布；四个架构的 APK 必须都打成功才会发布，不发缺架构的版本
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 创建 Release 需要写权限，只给这个 job

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: toTool-*
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
