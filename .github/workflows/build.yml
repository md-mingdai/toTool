name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']          # 推送 v1.0.0 这类标签时，自动发布到 Releases
  pull_request:
  workflow_dispatch:      # 允许在 Actions 页面手动点「Run workflow」

# 同一分支上有新提交时，取消还没跑完的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          # basic = 开源缓存实现，公开/私有仓库都免费
          cache-provider: basic

      - name: 准备构建环境
        run: |
          # local.properties 里是本机的 SDK 路径，在云端会导致 "SDK location not found"
          rm -f local.properties
          # 从 Windows 提交的仓库可能丢失可执行位
          chmod +x gradlew
          # 预先接受 Android SDK 许可证，Gradle 才能自动下载 compileSdk 37 的平台包
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ---- 可选：固定签名密钥（不配置也能构建，用 debug 签名）----
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已使用 Secrets 中的签名密钥"
          else
            echo "::notice title=未配置签名密钥::使用 debug 签名。每次构建的 debug 签名都不同，安装新版前需要先卸载旧版。"
          fi

      - name: 构建 Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 整理 APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NAME="toTool-v${VERSION}-${SHORT_SHA}"
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "::error::没有找到构建出的 APK"; exit 1; fi
          cp "$SRC" "dist/${NAME}.apk"
          ls -lh dist
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 构建失败时，把详细报告传上来方便排查
      - name: 上传构建报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    # 只有推送 v* 标签时才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 创建 Release 需要写权限，只给这个 job

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: toTool-*
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
