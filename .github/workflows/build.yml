name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']          # 推送 v1.0.0 这类标签时，自动发布到 Releases
  pull_request:
  workflow_dispatch:      # 允许在 Actions 页面手动点「Run workflow」

# 同一分支上有新提交时，取消还没跑完的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 第一步：从源码交叉编译 FFmpeg（纯 LGPL），每个 CPU 架构一个任务，四个并行。
  #
  # 产物 libffmpeg.so 其实是个静态链接的 ffmpeg 可执行文件（见 ffmpeg/build.sh 开头的说明），
  # 下一个任务会把它们放进 app/src/main/jniLibs/<abi>/ 再打包 APK。
  # 编译脚本、版本号、校验值都在 ffmpeg/ 目录下，升级 FFmpeg 只需要改 ffmpeg/versions.env。
  # ---------------------------------------------------------------------------
  ffmpeg:
    name: FFmpeg · ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false      # 某个架构失败时，其它架构继续编，方便一次看全问题
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    env:
      ABI: ${{ matrix.abi }}
      FFMPEG_INSTALL: '0'   # CI 里不用把产物复制进 app/src/main/jniLibs，由下一个任务统一放

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 缓存键里带着编译脚本和版本文件的哈希：这两个文件没改，就直接复用上次编好的 libffmpeg.so，
      # 平时只改应用代码的提交不会重新编译 FFmpeg（编一次要十几分钟）。
      - name: 还原已编好的 libffmpeg.so（缓存）
        id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg/out/${{ matrix.abi }}
          key: ffmpeg-${{ matrix.abi }}-${{ hashFiles('ffmpeg/build.sh', 'ffmpeg/versions.env') }}

      - name: 安装编译工具
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          # nasm：x86_64 的汇编优化要用；其余（git / curl / make / cmake / gcc / binutils）runner 上自带，
          # pkg-config 也是自带的，这里写上只是保险
          sudo apt-get install -y --no-install-recommends nasm pkg-config
          for t in git curl make cmake pkg-config gcc readelf; do
            command -v "$t" > /dev/null || { echo "::error::runner 上没有 $t"; exit 1; }
          done
          cmake --version | head -n 1

      - name: 准备 Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # NDK 版本固定在 ffmpeg/versions.env 里，保证每次编出来的东西一样
          source ffmpeg/versions.env
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "${NDK_DIR}/toolchains/llvm/prebuilt" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "ndk;${NDK_VERSION}"
          fi
          [ -d "${NDK_DIR}/toolchains/llvm/prebuilt" ] || { echo "::error::没有装好 NDK ${NDK_VERSION}"; exit 1; }
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: 编译 FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ffmpeg/build.sh "$ABI"

      # 命中缓存时没有重新编译，这里单独再检查一遍（ELF 格式、16 KB 对齐、只依赖系统库、纯 LGPL）
      - name: 校验缓存里的 libffmpeg.so
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          bash ffmpeg/build.sh verify "$ABI"
          {
            echo "### FFmpeg ($ABI)（来自缓存）"
            echo '```'
            cat "ffmpeg/out/$ABI/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 整理产物
        run: |
          mkdir -p "stage/$ABI"
          cp "ffmpeg/out/$ABI/libffmpeg.so" "stage/$ABI/libffmpeg.so"
          ls -l "stage/$ABI"

      # 产物目录结构是 <abi>/libffmpeg.so，下载时合并在一起就是 jniLibs 的样子
      - name: 上传 libffmpeg.so
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-bin-${{ matrix.abi }}
          path: stage
          if-no-files-found: error
          retention-days: 7

      # 编译失败时把完整日志传上来（各组件的 configure / make 输出，以及 config.log）
      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-logs-${{ matrix.abi }}
          path: ffmpeg/work/${{ matrix.abi }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 第二步：把各架构的 libffmpeg.so 放进 jniLibs，打 Release APK
  # ---------------------------------------------------------------------------
  build:
    name: Build release APK
    needs: ffmpeg
    # 某个架构的 FFmpeg 编失败时（整个流程会标红），仍然用已经编好的架构打出 APK，
    # 方便先拿到能用的包；缺 arm64-v8a 才直接中止。被取消时不再继续。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 以前仓库里提交过一份 arm64 的预编译 libffmpeg.so；万一还残留着，先清掉，
      # 保证打进 APK 的全部是上一步从源码编出来的（某个架构没编出来就是缺，而不是悄悄用旧文件顶上）
      - name: 清掉仓库里残留的 libffmpeg.so
        run: rm -f app/src/main/jniLibs/*/libffmpeg.so

      - name: 下载各架构的 libffmpeg.so
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-bin-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: 检查 libffmpeg.so
        run: |
          missing=""
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            f="app/src/main/jniLibs/$abi/libffmpeg.so"
            if [ -s "$f" ]; then
              chmod 755 "$f"
            else
              missing="$missing $abi"
            fi
          done
          ls -l app/src/main/jniLibs/*/ || true
          case " $missing " in
            *" arm64-v8a "*)
              echo "::error title=缺少 arm64-v8a 的 libffmpeg.so::FFmpeg 任务没有产出 arm64-v8a，请先看上面 FFmpeg 任务的日志。"
              exit 1
              ;;
          esac
          if [ -n "$missing" ]; then
            echo "::warning title=APK 缺少部分架构的 libffmpeg.so::缺少：${missing}。这些架构的设备上，格式转换功能会提示不支持。"
          fi

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          # basic = 开源缓存实现，公开/私有仓库都免费
          cache-provider: basic

      - name: 准备构建环境
        run: |
          # local.properties 里是本机的 SDK 路径，在云端会导致 "SDK location not found"
          rm -f local.properties
          # 从 Windows 提交的仓库可能丢失可执行位
          chmod +x gradlew
          # 预先接受 Android SDK 许可证，Gradle 才能自动下载 compileSdk 37 的平台包
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ---- 可选：固定签名密钥（不配置也能构建，用 debug 签名）----
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已使用 Secrets 中的签名密钥"
          else
            echo "::notice title=未配置签名密钥::使用 debug 签名。每次构建的 debug 签名都不同，安装新版前需要先卸载旧版。"
          fi

      - name: 构建 Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 整理 APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NAME="toTool-v${VERSION}-${SHORT_SHA}"
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "::error::没有找到构建出的 APK"; exit 1; fi
          cp "$SRC" "dist/${NAME}.apk"
          ls -lh dist
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # 确认 APK 里真的带上了各架构的 libffmpeg.so
      - name: 检查 APK 里的 libffmpeg.so
        run: |
          APK=$(find dist -name '*.apk' | head -n 1)
          unzip -l "$APK" | grep -E 'lib/[^/]+/libffmpeg\.so' || { echo "::error::APK 里没有 libffmpeg.so"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 构建失败时，把详细报告传上来方便排查
      - name: 上传构建报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    # 只有推送 v* 标签时才发布；FFmpeg 的四个架构必须都编成功，不发缺架构的包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ffmpeg, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 创建 Release 需要写权限，只给这个 job

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: toTool-*
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
